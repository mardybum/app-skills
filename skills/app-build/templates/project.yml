# XcodeGen-Vorlage. <App>, <app> und <Kit> ersetzen; nicht benötigte Teile löschen.
name: <App>
options:
  bundleIdPrefix: de.rudall
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de        # Standardsprache bewusst wählen (askesis: en)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"   # archive.sh setzt die Commit-Anzahl
packages:
  <Kit>:
    path: Packages/<Kit>
targets:
  <App>:
    type: application
    platform: iOS
    sources:
      - path: <App>
    dependencies:
      - package: <Kit>
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rudall.<app>
        PRODUCT_NAME: <App>
        TARGETED_DEVICE_FAMILY: "1,2"   # pro Target setzen! "1" = nur iPhone
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JTF9P5K777
        INFOPLIST_KEY_CFBundleDisplayName: "<Anzeigename>"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.<education|productivity|…>"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  <App>Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: <App>Tests
    dependencies:
      - target: <App>
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: de.rudall.<app>.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/<App>.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/<App>"
        BUNDLE_LOADER: "$(TEST_HOST)"
  <App>UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: <App>UITests
    dependencies:
      - target: <App>
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: de.rudall.<app>.uitests
        TEST_TARGET_NAME: <App>
schemes:
  <App>:
    build:
      targets:
        <App>: all
        <App>Tests: [test]
        <App>UITests: [test]
    test:
      targets:
        - <App>Tests
        - <App>UITests
