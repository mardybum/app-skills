# GitHub Actions für Next.js + Supabase + Vercel (aus Hablamos). Als .github/workflows/ci.yml ablegen.
# Secret im Repo: VERCEL_DEPLOY_HOOK (Vercel → Project → Settings → Git → Deploy Hooks).
# Optional: SMOKE_URL und SMOKE_CODE für den Smoke-Test nach dem Deploy.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Security-Audit
        run: npm audit --audit-level=critical

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Vercel-Deploy auslösen
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
